# Continuous integration — what runs on every push and pull request.
#
# WHAT THIS REPLACES. Four workflows were removed with this one:
#   - `deploy.yml` ran on a SELF-HOSTED VPS runner and reloaded a server at
#     /var/www/School-app. There is no such server any more.
#   - `build-prisma-engine.yml` compiled a Prisma engine binary and committed it
#     back to the repo.
#   - `migration-safety.yml` proved claims about `prisma migrate deploy` against a
#     throwaway PostgreSQL, for a migration path that is no longer how this app is
#     deployed.
#   - `playwright.yml` ran browser tests against the legacy tenant database.
#
# All four belonged to the Oliskey architecture. None of them could pass here.
#
# WHAT THIS DOES. Two jobs, both fast:
#   1. `verify` — the checks that catch real mistakes: type-checking the frontend
#      and the backend, running the unit test suite, building the app, and
#      building the API function that Vercel serves.
#   2. `deploy` — hands the commit to Vercel. It runs only after `verify` passes
#      and only on the main branch, so a pull request is checked but never
#      deployed.
#
# WHY THE BUILD IS PART OF CI, NOT ONLY THE DEPLOY. The unit suite can be green
# while the app does not build — a missing export, a bad import path. Building
# here means a broken build is caught on the commit that caused it, rather than
# being discovered as a failed deployment.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the previous run's result irrelevant. Cancel
# it rather than paying for both. `main` is excluded so a release is never left
# half-checked by its own follow-up commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # The Node version comes from .nvmrc so the runner, the local machine and
      # the pin in package.json cannot drift apart.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `npm ci` installs exactly what the lockfile says, so CI cannot pass on a
      # dependency version that no one has. It also fails loudly if the lockfile
      # and package.json disagree.
      - name: Install dependencies
        run: npm ci

      # The backend is compiled by TypeScript, and the generated database client
      # has to exist before it can be type-checked.
      - name: Prepare the database client
        run: npm run prisma:generate

      - name: Type-check the frontend
        run: npx tsc --noEmit

      - name: Type-check the backend
        run: npx tsc --noEmit -p backend/tsconfig.json

      - name: Run the unit tests
        run: npm run test:run

      - name: Build the app
        run: npm run build

      # NOTE ON THE BACKEND. The Express API is still type-checked and covered by
      # the backend type-check above, but it is NOT built or deployed here. Vercel
      # serves the frontend only, and the app reads and writes through Supabase
      # directly — so there is no serverless function to build. The API's Prisma
      # schema describes the previous product's database, not this school's.

  # ---------------------------------------------------------------------------
  # The database checks. This is the job that would have caught the findings in
  # the 2026-10-10 audit, and it is the reason they can be said to be closed:
  # every one of them has a check here that FAILS when the guard is removed.
  #
  # It is a SEPARATE job from `verify` on purpose. `verify` is fast and answers
  # "does this build and do the screens still work". This one spins up a real
  # PostgreSQL, applies every migration to an empty database, and asks whether the
  # rules actually hold — including anonymous access, guardianship scope, the last
  # administrator, temporary passwords, money, and stored files.
  #
  # WHY IT MATTERS MORE THAN USUAL HERE. Authorization lives in the database, in
  # policies and functions that no browser ever sees. A screen that looks right
  # proves nothing about what a caller can fetch directly. Without this job, the
  # only thing standing between a regression and the school's records is review.
  database:
    name: Database rules
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # The suite needs a real server to build a scratch cluster — it creates its
      # own database, its own roles and its own data. PostgreSQL 17 matches the
      # version the migrations are written against.
      - name: Install PostgreSQL 17
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-client-17
          /usr/lib/postgresql/17/bin/initdb --version

      # ONE COMMAND. The runner resets its own scratch cluster, applies every
      # migration in order, runs every suite, and exits non-zero if any check
      # fails. Keeping the wiring inside the script means CI and a developer's
      # machine run the same thing, in the same order — the order is load-bearing,
      # because a later migration replaces functions an earlier one defined.
      - name: Run the migration and policy suites
        run: bash supabase/tests/run_phase5_tests.sh

      # The suite's own summary line is quoted back, so a run that passed with
      # fewer checks than expected is visible rather than merely green.
      - name: Summarise
        if: always()
        run: |
          echo "The database suite prints its own summary above."
          echo "A PASS with fewer checks than the previous run means a suite stopped early."

  deploy:
    name: Deploy to Vercel
    needs: verify
    # Only from the main branch. A pull request is verified above and stops there.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The deployment is created here rather than through Vercel's own Git
    # integration, so that a deployment cannot happen unless the checks above
    # passed. Vercel's integration would deploy on push regardless of CI.

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # A secret cannot be read before it has been added to the repository. The
      # explicit check turns "the secret is missing" into a message that says so,
      # instead of a confusing failure from the deploy command.
      - name: Check the deployment secrets exist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Deployment secrets are present."

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          # The CLI version is PINNED. `@latest` meant the deploy tool could change
          # between two identical commits, so a deployment that worked yesterday
          # could fail today for a reason unrelated to this repository — and a
          # deployment is the worst place to discover that.
          #
          # To move it: run the deploy locally with the new version, confirm it
          # succeeds, then change this pin in the same commit.
          npx --yes vercel@48.2.1 deploy --prod --yes --token "$VERCEL_TOKEN"
