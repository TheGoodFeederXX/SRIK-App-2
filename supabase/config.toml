# Supabase configuration — SRIK (Sekolah Rendah Islam Al-Khairiah)
#
# Single-school system. There is no tenant/branch configuration here by design
# (see docs/srik/01_DECISIONS.md): SchoolProfile is a configuration row, not a
# tenant, and no domain table carries school_id or branch_id.
#
# Project: qtpsuemjzxngltpblkoj (PostgreSQL 17.11)
# Credentials live in .env (gitignored). Never commit secrets here.

project_id = "qtpsuemjzxngltpblkoj"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 5432
# Remote project runs PostgreSQL 17.
major_version = 17

[db.seed]
# Synthetic data only. Never seed real student, guardian or staff data.
enabled = false
sql_paths = ["./seed/seed.sql"]

[auth]
enabled = true
# Student and parent logins are deferred (see 09_DEFERRED_ROADMAP.md); only
# ADMIN and TEACHER authenticate in v1.
enable_signup = false
enable_anonymous_sign_ins = false
# Profiles are created by a trigger on auth.users, not by the client.
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true

[storage]
# Private buckets for student/teacher documents and avatars (08_PHASE_6).
enabled = true
file_size_limit = "10MiB"

[realtime]
# Enabled selectively later; v1 is app-shell cache only.
enabled = false

[functions.provision-teacher-account]
# The platform itself rejects a request with no valid login before this code
# ever runs. The function then re-checks the caller's PERMISSION in the
# database, because a valid login is not the same as the right to create users.
verify_jwt = true
