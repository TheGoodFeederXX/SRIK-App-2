  <!-- 1200x630: the card below declares summary_large_image, which the old

  <meta name="twitter:image" content="/school-logo.png" />
  <meta name="twitter:image:alt" content="Logo Sekolah Rendah Islam Al-Khairiah" />

  <!-- Structured data.
       SRIK is ONE school, not a software vendor. An earlier version of this
       block described a company, a second website, a foreign-country locale and
       a third-party review profile — all facts about the company this app was
       originally built for. Claiming them would have told search engines
       something untrue about this school, so the block now describes only the
       school itself. No ratings, reviews or counts are asserted anywhere: such
       fields describe claims a publisher must be able to substantiate. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "School",
      "name": "Sekolah Rendah Islam Al-Khairiah",
      "alternateName": "SRIK",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Jalan Pedu",
        "postalCode": "06300",
        "addressLocality": "Kuala Nerang",
        "addressRegion": "Kedah",
        "addressCountry": "MY"
      },
      "email": "srialkhairiah@gmail.com",
      "telephone": "+60105119582"
    }
  </script>

  <!-- Colour scheme, applied before first paint so there is no flash. The
       choice ("light" | "dark" | "system") is saved per device and to the
       account (lib/uiPreferences.ts); the dark palette itself is one generated
       stylesheet (styles/dark-theme.css) that covers every screen. -->
  <script>
    (function () {
      try {
        var s = localStorage.getItem('colorScheme') || (localStorage.getItem('darkMode') === 'true' ? 'dark' : 'light');
        var dark = s === 'dark' || (s === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { document.documentElement.classList.remove('dark'); }
    })();
  </script>
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      color-scheme: light only;
    }
  </style>

</head>
